name: Build site

# Builds the React app in app/ and commits the finished site to the root of
# main, which is where GitHub Pages ("Deploy from a branch: main / root")
# serves from.

on:
  push:
    branches: [main]
    paths:
      - 'app/**'
      - '.github/workflows/build-site.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-site
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        working-directory: app
        run: npm install

      - name: Build
        working-directory: app
        run: npm run build

      - name: Copy build to repo root
        run: |
          rm -rf assets index.html favicon.svg
          cp -r app/dist/. .
          touch .nojekyll

      - name: Commit built site
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898333+github-actions[bot]@users.noreply.github.com"
          git add -A assets index.html favicon.svg .nojekyll
          if git diff --cached --quiet; then
            echo "Built site unchanged."
          else
            git commit -m "Build site from ${GITHUB_SHA::7}"
            git push
          fi
